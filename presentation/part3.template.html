CODE.draftcontext = `/// **The Golden Invariant, as a type.**
///
/// A draft runs against this and nothing else. It is owned,
/// Send, and 'static: it cannot hold a reference to the engine,
/// another node, or the Sovereign Graph, because there is no
/// lifetime parameter through which such a reference could enter.
///
/// Its fields are private. Identity and inputs are read through
/// getters and cannot be changed; outputs are produced only
/// through methods that record what happened (burn,
/// record_handover, leave_paper, propose). The engine reconciles
/// from that record, keyed by the job it issued, never from a
/// field a seat could set. A seat cannot rename itself, cannot
/// burn another purse, cannot calibrate its own truth for free,
/// and cannot forge a signature, because none of those are
/// things the type lets it say.
#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]
pub struct DraftContext {
    node_id: NodeId,
    node_name: String,
    stage: Stage,
    tick: u64,
    parent: Option<NodeId>,
    known_peers: Vec<NodeId>,
    children: Vec<NodeId>,
    purse: Purse,           // a copy, reconciled in Collect
    oak: OakSnapshot,       // a copy, frozen at this tick

    receipts: Vec<SeatReceipt>,
    handovers: Vec<Handover>,
    cushion: f64,

}

fn assert_send_static<T: Send + 'static>() {}

}`;
CODE.tick = `/// One temporal block. (Condensed; the full function is 60 lines.)
pub async fn tick(&mut self) -> TickReport {
    self.tick += 1;
    let tick = self.tick;
    let mut report = TickReport { tick, ..Default::default() };

    // ── Phase 1: DRAFT. Off-chain, parallel, isolated. ──
    let mut jobs = Vec::new();
    for node in self.nodes.values_mut() {
        if !node.is_draftable() { continue; }      // at the door: zero idle burn
        let ctx = node.draft_context(tick, seed, cost_visible);
        jobs.push(DraftJob { ctx, seats: staff.clone() });
    }
    let results = self.executor.run(jobs).await;   // Tokio on native, in order on wasm

    // ── Phase 2: COLLECT. Reconcile burns, mint envelopes, tax, courier rule. ──
    for ctx in results { self.collect(ctx, tick, &mut report); }

    // ── Phase 3: VERIFY. The gates; court slash and rollback. ──
    self.verify(tick, &mut report);

    // ── Phase 4: COMMIT. Settle and deliver into the graph. ──
    self.commit(tick, &mut report);

    self.decay_idle(&drafted);                    // the world moved; idle caches did not
    report.packed_groups = self.macro_ticks();    // O(1) stasis for packed groups
    report.root = self.graph.snapshot(tick);      // the block's root
    if tick % self.config.stark_period == 0 { self.heartbeat(tick); }
    report
}`;
CODE.strategy = `pub trait VerificationStrategy: Send + Sync {
    fn stage(&self) -> Stage;
    fn verify(&mut self, env: &ProposalEnvelope, view: &BoundaryView<'_>) -> Verdict;
    /// Batch hook. Stage 3 overrides it with netting.
    fn verify_batch(&mut self, envs: &[ProposalEnvelope], view: &BoundaryView<'_>) -> Vec<Verdict> {
        envs.iter().map(|e| self.verify(e, view)).collect()
    }
}

pub enum Verdict {
    Approved,
    Rejected { reason: String },              // destroyed; nothing refunded
    Held { reason: HoldReason },              // parked at the gate; zero idle burn
    Slashed { amount: f64, reason: String },
}

impl VerificationStrategy for Stage1Door {
    fn verify(&mut self, env: &ProposalEnvelope, view: &BoundaryView<'_>) -> Verdict {
        if let Some(v) = preflight(env, view) { return v; }
        if !env.payload.needs_signature_at_house() {
            return Verdict::Approved;             // looking is free of the door
        }
        match view.decisions.get(env.id) {
            Some(HumanDecision::Approve) => Verdict::Approved,
            Some(HumanDecision::Reject)  => Verdict::Rejected { reason: "the person said no at the door".into() },
            None => Verdict::Held { reason: HoldReason::AwaitingHumanSignature },
        }
    }
}`;

const KW = /\b(pub|struct|enum|impl|fn|let|mut|async|await|match|for|in|if|else|return|use|mod|trait|type|const|where|self|Self|dyn|move|ref|as|loop|while|break|continue)\b/g;
function hl(src, lang) {
  const esc = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  if (lang === 'sh') return esc.replace(/(#.*)$/gm, '<span class="c">$1</span>').replace(/^(cargo|cd)\b/gm, '<span class="k">$1</span>').replace(/(--[a-z-]+)/g, '<span class="t">$1</span>');
  return esc.split('\n').map(line => {
    const m = line.match(/^(\s*)(\/\/.*)$/);
    if (m) return m[1] + `<span class="c">${m[2]}</span>`;
    let code = line, comment = '';
    const ci = line.indexOf('//');
    if (ci >= 0 && !/["']/.test(line.slice(0, ci))) { code = line.slice(0, ci); comment = `<span class="c">${line.slice(ci)}</span>`; }
    code = code.replace(/("[^"]*")/g, '<span class="s">$1</span>')
      .replace(KW, '<span class="k">$1</span>')
      .replace(/\b([A-Z][A-Za-z0-9_]*)\b/g, '<span class="t">$1</span>')
      .replace(/\b(\d+(\.\d+)?)\b/g, '<span class="n">$1</span>')
      .replace(/(#\[[^\]]*\])/g, '<span class="a">$1</span>'); // attributes last: the spans above must not be re-matched
    return code + comment;
  }).join('\n');
}

  el.doorYes.addEventListener('click', () => { if (!Eng.live()) return; Eng.authorize(el.doorYes.dataset.env); logLine(UI.frame.tick, 'DOOR', 'commit', 'you said yes. The send cost comes out of the purse now.'); if (!UI.running) stepOnce(); });
  el.doorNo.addEventListener('click', () => { if (!Eng.live()) return; Eng.reject(el.doorNo.dataset.env); logLine(UI.frame.tick, 'DOOR', 'reject', 'you said no. The draft stays on the table; the compute that made it is gone.'); if (!UI.running) stepOnce(); });
  el.topup.addEventListener('click', () => { if (!Eng.live()) return; Eng.topUp(el.topup.dataset.node, 200); if (!UI.running) stepOnce(); });
  el.truth.addEventListener('click', () => { if (!Eng.live()) return; Eng.setTruth(12); el.truthNote.textContent = 'done: the truth is 12; every table still says 10 until it pays the oracle'; logLine(UI.frame.tick, 'WORLD', 'verify', 'the truth moved: the courier now costs 12; every table still says 10'); });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); stop(); stepOnce(); }
  });
}

/* ───────────────────────────── page chrome ───────────────────────────── */
function wireRail() {
  const links = $$('[data-rail]'); const secs = links.map(a => $(a.getAttribute('href')));
  const io = new IntersectionObserver(entries => { for (const en of entries) if (en.isIntersecting) { links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id)); } }, { rootMargin: '-40% 0px -55% 0px' });
  secs.forEach(s => s && io.observe(s));
  const all = $$('section.act');
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'p') { document.body.classList.toggle('presenting'); return; }
    if (!['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp'].includes(e.key)) return;
    const mid = scrollY + innerHeight * 0.35;
    let idx = all.findIndex((s, i) => { const next = all[i + 1]; return s.offsetTop <= mid && (!next || next.offsetTop > mid); });
    if (idx < 0) idx = 0;
    const to = e.key === 'ArrowRight' || e.key === 'PageDown' ? Math.min(all.length - 1, idx + 1) : Math.max(0, idx - 1);
    all[to].scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); e.preventDefault();
  });
}
function fillStatic() {
  $$('pre.code').forEach(p => { const k = p.dataset.code; p.innerHTML = hl(CODE[k], k === 'run' ? 'sh' : 'rust'); });
  $('#file-tree').innerHTML = FILES.map(([f, d]) => `<div><b>${f}</b> <i>· ${d}</i></div>`).join('');
  $('#proof-list').innerHTML = PROOFS.map(([t, d]) => `<div><span class="ok">✓</span><span><code>${t}</code> · ${d}</span></div>`).join('');
  for (const side of ['backend', 'frontend']) $(`[data-stack="${side}-layers"]`).innerHTML = STACK[side].map(([l, s]) => `<div class="layer"><b>${l}</b><span>${s}</span></div>`).join('');
  // the house-run sentence follows the recorded trace, so a re-recorded run cannot leave the copy stale
  const hr = $('[data-fact="house-run"]'); const hf = TRACE && TRACE.house && TRACE.house.length ? TRACE.house[TRACE.house.length - 1] : null; const hh = hf ? hf.state.nodes.find(n => n.stage === 'House') : null;
  if (hr && hh) hr.textContent = `On ${fmt1(hh.compute_allocated)} cr and ${hh.tasks_total} tasks, seed 7, with the person saying yes after three ticks at the door, the recorded run sends ${hh.tasks_done} of ${hh.tasks_total} and ends after ${hf.tick} ticks with ${fmt1(hh.compute)} cr in the purse, Φ ${(hh.confidence * 100).toFixed(1)}%, ${fmt1(hf.state.totals.tax_paid)} cr paid in crossing tax${hh.status === 'halted' ? ', halted with the note on the table' : ''}.`;
  drawCoasean($('[data-chart="coasean"]'));
  drawDrift($('[data-chart="drift"]'));
}

async function boot() {
  fillStatic(); wireRail(); wireConsole();
  await Eng.init();
  const v = Eng.version(); $('#foot-version').textContent = v;
  if (Eng.live()) { el.badge.innerHTML = `engine · <b>live</b> · ${v}`; }
  else if (Eng.mode === 'replay') { el.badge.innerHTML = `engine · <b class="replay">recorded run</b> · ${v}`; el.banner.hidden = false; [el.budget, el.tasks, el.seed].forEach(i => i.disabled = true); $$('#camera button').forEach(b => b.disabled = true); }
  else { el.badge.innerHTML = `engine · <b class="replay">unavailable</b>`; el.thoughts.innerHTML = '<div class="thought"><b>engine</b><span>Neither WebAssembly nor a recorded run is available in this viewer.</span></div>'; return; }
  reset();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
