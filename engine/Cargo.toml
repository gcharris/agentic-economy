[package]
name = "context-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "The invisible context engine for The Agentic Economy: an Asynchronous Agentic State Machine (AASM)."
publish = false

[lib]
name = "context_engine"
crate-type = ["rlib", "cdylib"]

[features]
# `native` = the Tokio multi-core draft executor and the `house` and `serve` binaries.
# Build for the browser with `--no-default-features --target wasm32-unknown-unknown`.
default = ["native"]
native = ["dep:tokio"]
# `vault` = a real `InferenceBackend` over the estate Vault route (src/agents/vault.rs).
# Native only: it implies `native` and is never part of the wasm build.
vault = ["native", "dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"], optional = true }
ureq = { version = "3.4.2", optional = true, default-features = false, features = ["rustls"] }

[[bin]]
name = "house"
required-features = ["native"]

# `serve`: the engine behind a dependency-free HTTP/1.1 + SSE wall (see src/bin/serve.rs).
[[bin]]
name = "serve"
required-features = ["native"]

[[test]]
name = "serve_smoke"
required-features = ["native"]

# `vault_backend`: the Vault backend against a loopback mock server; no live call.
[[test]]
name = "vault_backend"
required-features = ["vault"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Size-optimised profile for the browser build of the same engine.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true
